<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game - لعبة المسابقات</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        :root {
            --deep-blue: #213448;
            --blue: #547792;
            --light-blue: #94B4C1;
            --cream: #EAE0CF;

            --cream-light: #F5F0E7;
            --text-dark: #213448;
            --text-light: #EAE0CF;
        }

        /* ================================
        BODY
        ================================ */

        body {
            background:
                radial-gradient(
                    circle at top,
                    #547792 0%,
                    #213448 45%,
                    #172636 100%
                );

            color: var(--text-light);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;

            padding: 30px;
        }

        /* ================================
        MAIN GAME CONTAINER
        ================================ */

        .game-container {
            width: 92%;
            max-width: 1050px;
            min-height: 680px;

            background:
                linear-gradient(
                    145deg,
                    #547792,
                    #213448
                );

            border: 3px solid var(--light-blue);

            border-radius: 24px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55),
                inset 0 0 40px rgba(234, 224, 207, 0.06);

            position: relative;

            padding: 45px 35px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            overflow: hidden;
        }

        .game-container::before {
            content: "";

            position: absolute;

            inset: 10px;

            border: 1px solid rgba(148, 180, 193, 0.35);

            border-radius: 17px;

            pointer-events: none;
        }

        /* ================================
        SCREENS
        ================================ */

        .screen {
            display: none;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;

            animation: fadeIn 0.35s ease-in-out;

            position: relative;
            z-index: 2;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ================================
        TOP BAR
        ================================ */

        .top-bar {
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;

            padding: 0 10px;
        }

        .category-badge {
            font-size: 1.25rem;

            color: var(--light-blue);

            font-weight: bold;

            letter-spacing: 0.3px;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* ================================
        SCORE
        ================================ */

        .score-board {
            background:
                linear-gradient(
                    135deg,
                    #547792,
                    #213448
                );

            border: 2px solid var(--light-blue);

            padding: 11px 25px;

            border-radius: 50px;

            font-size: 1.25rem;

            font-weight: bold;

            color: var(--cream-light);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .score-val {
            color: var(--cream);
        }

        /* ================================
        GENERAL BUTTONS
        ================================ */

        .btn {
            background:
                linear-gradient(
                    145deg,
                    #EAE0CF,
                    #D9CEBC
                );

            color: var(--text-dark);

            border: 2px solid var(--light-blue);

            padding: 15px 30px;

            font-size: 1.15rem;

            font-weight: 700;

            border-radius: 13px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.3);

            text-align: center;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-4px);

            background:
                linear-gradient(
                    145deg,
                    var(--light-blue),
                    var(--blue)
                );

            color: var(--deep-blue);

            border-color: var(--cream);

            box-shadow:
                0 8px 18px rgba(33, 52, 72, 0.5),
                0 0 15px rgba(148, 180, 193, 0.45);
        }

        .btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.38;

            cursor: not-allowed;

            border-color: #547080;

            background: #344C60;

            color: #A9B9C2;

            box-shadow: none;
        }

        /* ================================
        LARGE BUTTON
        ================================ */

        .btn-large {
            font-size: 1.8rem;

            padding: 20px 60px;

            border-color: var(--light-blue);

            border-radius: 15px;
        }

        .btn-large:hover:not(:disabled) {
            background:
                linear-gradient(
                    145deg,
                    var(--light-blue),
                    var(--blue)
                );

            color: var(--deep-blue);

            border-color: var(--cream);

            box-shadow:
                0 10px 25px rgba(33, 52, 72, 0.5),
                0 0 20px rgba(148, 180, 193, 0.5);
        }

        /* ================================
        START SCREEN
        ================================ */

        .game-title {
            font-size: 3.8rem;

            color: var(--light-blue);

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(148, 180, 193, 0.25);

            margin-top: 150px;    
            margin-bottom: 45px;

            text-align: center;

            line-height: 1.1;
        }

        .game-title span {
            color: var(--cream-light) !important;
        }

        /* ================================
        GRIDS
        ================================ */

        .grid-container {
            display: grid;

            gap: 18px;

            width: 100%;

            margin-top: 20px;
        }

        .grid-categories {
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
        }

        .grid-questions {
            grid-template-columns:
                repeat(3, 1fr);
        }

        /* ================================
        DIFFICULTY
        ================================ */

        .difficulty-list {
            display: flex;

            flex-direction: column;

            gap: 17px;

            width: 100%;

            max-width: 520px;

            margin-top: 20px;
        }

        .btn-easy {
            border-color: var(--light-blue);
        }

        .btn-medium {
            border-color: var(--blue);
        }

        .btn-hard {
            border-color: var(--deep-blue);
        }

        /* ================================
        EASY - GREEN HOVER
        ================================ */

        .btn-easy:hover:not(:disabled) {
            background:
                linear-gradient(
                    145deg,
                    #4CAF50,
                    #2E7D32
                ) !important;

            color: #EAE0CF !important;

            border-color: #81C784 !important;

            box-shadow:
                0 8px 18px rgba(76, 175, 80, 0.45),
                0 0 15px rgba(76, 175, 80, 0.35) !important;

            transform: translateY(-4px);
        }

        /* ================================
        MEDIUM - YELLOW HOVER
        ================================ */

        .btn-medium:hover:not(:disabled) {
            background:
                linear-gradient(
                    145deg,
                    #FFD54F,
                    #F9A825
                ) !important;

            color: #213448 !important;

            border-color: #FFE082 !important;

            box-shadow:
                0 8px 18px rgba(255, 193, 7, 0.45),
                0 0 15px rgba(255, 193, 7, 0.35) !important;

            transform: translateY(-4px);
        }

        /* ================================
        HARD - RED HOVER
        ================================ */

        .btn-hard:hover:not(:disabled) {
            background:
                linear-gradient(
                    145deg,
                    #EF5350,
                    #C62828
                ) !important;

            color: #EAE0CF !important;

            border-color: #EF9A9A !important;

            box-shadow:
                0 8px 18px rgba(239, 83, 80, 0.45),
                0 0 15px rgba(239, 83, 80, 0.35) !important;

            transform: translateY(-4px);
        }

        /* ================================
        QUESTION CARD
        ================================ */

        .question-card {
            background:
                linear-gradient(
                    145deg,
                    #F5F0E7,
                    #EAE0CF
                );

            color: var(--text-dark);

            border: 2px solid var(--light-blue);

            border-radius: 17px;

            padding: 30px;

            width: 100%;

            text-align: center;

            font-size: 1.5rem;

            font-weight: 600;

            margin-bottom: 20px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* ================================
        TIMER
        ================================ */

        .timer-section {
            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            margin-bottom: 20px;
        }

        .timer-text {
            font-size: 1.7rem;

            font-weight: bold;

            color: var(--light-blue);

            margin-bottom: 8px;

            text-shadow:
                0 2px 7px rgba(0, 0, 0, 0.5);
        }

        .timer-container {
            width: 100%;

            height: 13px;

            background: #172636;

            border: 1px solid var(--blue);

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .timer-bar {
            width: 100%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #547792,
                    #94B4C1
                );

            transition: width 1s linear;

            box-shadow:
                0 0 8px rgba(148, 180, 193, 0.45);
        }

        /* ================================
        ANSWER BUTTONS
        ================================ */

        .choices-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

            width: 100%;

            margin-bottom: 20px;
        }

        .btn-choice {
            background:
                linear-gradient(
                    145deg,
                    #547792,
                    #213448
                );

            color: var(--cream-light);

            border-color: var(--light-blue);

            min-height: 65px;

            font-size: 1.15rem;
        }

        .btn-choice:hover:not(:disabled) {
            background:
                linear-gradient(
                    145deg,
                    var(--light-blue),
                    var(--blue)
                );

            color: var(--deep-blue);

            border-color: var(--cream);

            box-shadow:
                0 6px 15px rgba(33, 52, 72, 0.4),
                0 0 12px rgba(148, 180, 193, 0.4);

            transform: translateY(-3px);
        }

        /* ================================
        CORRECT ANSWER - GREEN
        ================================ */

        .btn-choice.correct {
            background:
                linear-gradient(
                    145deg,
                    #4CAF50,
                    #2E7D32
                ) !important;

            border-color:
                #81C784 !important;

            color:
                #EAE0CF !important;

            box-shadow:
                0 0 18px rgba(76, 175, 80, 0.55);

            transform: none;
        }

        /* ================================
        WRONG ANSWER - RED
        ================================ */

        .btn-choice.wrong {
            background:
                linear-gradient(
                    145deg,
                    #EF5350,
                    #C62828
                ) !important;

            border-color:
                #EF9A9A !important;

            color:
                #EAE0CF !important;

            box-shadow:
                0 0 18px rgba(239, 83, 80, 0.55);

            transform: none;
        }

        /* ================================
        CONTROLS
        ================================ */

        .question-controls {
            display: flex;

            flex-wrap: wrap;

            gap: 15px;

            width: 100%;

            justify-content: center;
        }

        /* ================================
        HEADINGS
        ================================ */

        .screen-title {
            font-size: 2.15rem;

            margin-bottom: 10px;

            color: var(--cream-light);

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* ================================
        RESPONSIVE
        ================================ */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .game-container {
                width: 100%;

                min-height: 95vh;

                padding: 30px 20px;

                border-radius: 18px;
            }

            .game-title {
                font-size: 2.7rem;
            }

            .grid-questions {
                grid-template-columns: 1fr;
            }

            .choices-grid {
                grid-template-columns: 1fr;
            }

            .top-bar {
                flex-direction: column;

                gap: 12px;
            }

            .question-controls {
                flex-direction: column;
            }

            .question-controls .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <!-- ================================
        START SCREEN
        ================================ -->

        <div id="start-screen" class="screen active">

            <h1 class="game-title">
                Quiz Game
                <br>
            </h1>

            <button
                class="btn btn-large"
                onclick="navigateTo('categories-screen')">

               Start

            </button>

        </div>


        <!-- ================================
        CATEGORIES SCREEN
        ================================ -->

        <div id="categories-screen" class="screen">

            <div class="top-bar">

                <span class="category-badge">
                    اختر الفئة
                </span>

                <div class="score-board">

                    النقاط:

                    <span class="score-val">
                        0
                    </span>

                </div>

            </div>

            <h2 class="screen-title">
                الفئات
            </h2>

            <div
                class="grid-container grid-categories"
                id="categories-grid">
            </div>

        </div>


        <!-- ================================
        DIFFICULTY SCREEN
        ================================ -->

        <div id="difficulty-screen" class="screen">

            <div class="top-bar">

                <span
                    class="category-badge"
                    id="diff-category-name">

                    الفئة

                </span>

                <div class="score-board">

                    النقاط:

                    <span class="score-val">
                        0
                    </span>

                </div>

            </div>

            <h2 class="screen-title">
                اختر مستوى الصعوبة
            </h2>

            <div class="difficulty-list">

                <button
                    class="btn btn-easy"
                    onclick="selectDifficulty('easy')">

                    🟢 سهل — 10 نقاط

                </button>

                <button
                    class="btn btn-medium"
                    onclick="selectDifficulty('medium')">

                    🟡 متوسط — 20 نقطة

                </button>

                <button
                    class="btn btn-hard"
                    onclick="selectDifficulty('hard')">

                    🔴 صعب — 40 نقطة

                </button>

            </div>

            <button
                class="btn"
                style="margin-top: 30px;"
                onclick="navigateTo('categories-screen')">

                العودة للفئات

            </button>

        </div>


        <!-- ================================
        QUESTION SELECTION SCREEN
        ================================ -->

        <div id="question-select-screen" class="screen">

            <div class="top-bar">

                <span
                    class="category-badge"
                    id="qsel-breadcrumb">

                    الفئة > المستوى

                </span>

                <div class="score-board">

                    النقاط:

                    <span class="score-val">
                        0
                    </span>

                </div>

            </div>

            <h2 class="screen-title">
                اختر سؤالاً
            </h2>

            <div
                class="grid-container grid-questions"
                id="questions-grid">
            </div>

            <div
                class="question-controls"
                style="margin-top: 30px;">

                <button
                    class="btn"
                    onclick="navigateTo('difficulty-screen')">

                    العودة للمستوى

                </button>

                <button
                    class="btn"
                    onclick="returnToCategories()">

                    العودة للفئات

                </button>

            </div>

        </div>


        <!-- ================================
        QUESTION SCREEN
        ================================ -->

        <div id="question-screen" class="screen">

            <div class="top-bar">

                <span
                    class="category-badge"
                    id="q-breadcrumb">

                    الفئة | مستوى

                </span>

                <div class="score-board">

                    النقاط:

                    <span class="score-val">
                        0
                    </span>

                </div>

            </div>


            <!-- TIMER -->

            <div class="timer-section">

                <div
                    class="timer-text"
                    id="timer-number">

                    ⏰ 30

                </div>

                <div class="timer-container">

                    <div
                        class="timer-bar"
                        id="timer-bar">
                    </div>

                </div>

            </div>


            <!-- QUESTION -->

            <div
                class="question-card"
                id="question-text">

                نص السؤال يظهر هنا...

            </div>


            <!-- ANSWERS -->

            <div
                class="choices-grid"
                id="choices-container">
            </div>


            <!-- CONTROLS -->

            <div class="question-controls">

                <button
                    class="btn"
                    id="reveal-btn"
                    onclick="revealAnswer()">

                    إظهار الإجابة الصحيحة

                </button>

                <button
                    class="btn"
                    onclick="returnToQuestionSelect()">

                    العودة للأسئلة

                </button>

                <button
                    class="btn"
                    onclick="returnToCategories()">

                    العودة للفئات

                </button>

            </div>

        </div>

    </div>


    <script>

        /* ================================
        GAME DATABASE
        ================================ */

        const gameData = {

                easy: [

                    {
                        q: "ما هي عاصمة فرنسا؟",

                    {

                ],

                    {

                            "السيادة الشعبية",
                            "الحصانة"
                        ],
                        ans: 0
                    },

                    {
                        q: "أي مدينة تستضيف مقر الاتحاد الأوروبي الرئيسي؟",

        /* ================================
        GAME STATE
        ================================ */

        let currentScore = 0;

        let selectedCategory = "";

        let selectedDifficulty = "";

        let selectedQuestionIndex = null;

        let timerInterval = null;

        let timeLeft = 30;

        let questionAnswered = false;

        const openedQuestions = new Set();

        const pointsMap = {
            easy: 10,
            medium: 20,
            hard: 40
        };

        const diffTextMap = {
            easy: "سهل",
            medium: "متوسط",
            hard: "صعب"
        };


        /* ================================
        INITIALIZATION
        ================================ */

        window.onload = () => {

            initCategories();

            updateScoreDisplays();

        };


        /* ================================
        NAVIGATION
        ================================ */

        function navigateTo(screenId) {

            document
                .querySelectorAll('.screen')
                .forEach(s =>
                    s.classList.remove('active')
                );

            document
                .getElementById(screenId)
                .classList.add('active');

        }


        /* ================================
        SCORE
        ================================ */

        function updateScoreDisplays() {

            document
                .querySelectorAll('.score-val')
                .forEach(el => {

                    el.textContent =
                        currentScore;

                });

        }


        /* ================================
        CATEGORIES
        ================================ */

        function initCategories() {

            const grid =
                document.getElementById(
                    'categories-grid'
                );

            grid.innerHTML = "";

            Object.keys(gameData).forEach(cat => {

                const btn =
                    document.createElement(
                        'button'
                    );

                btn.className = 'btn';

                btn.textContent = cat;

                btn.onclick = () =>
                    selectCategory(cat);

                grid.appendChild(btn);

            });

        }


        function selectCategory(cat) {

            selectedCategory = cat;

            document
                .getElementById(
                    'diff-category-name'
                )
                .textContent = cat;

            navigateTo(
                'difficulty-screen'
            );

        }


        /* ================================
        DIFFICULTY
        ================================ */

        function selectDifficulty(diff) {

            selectedDifficulty = diff;

            document
                .getElementById(
                    'qsel-breadcrumb'
                )
                .textContent =
                `${selectedCategory} > ${diffTextMap[diff]}`;

            renderQuestionButtons();

            navigateTo(
                'question-select-screen'
            );

        }


        /* ================================
        QUESTION BUTTONS
        ================================ */

        function renderQuestionButtons() {

            const qGrid =
                document.getElementById(
                    'questions-grid'
                );

            qGrid.innerHTML = "";

            [0, 1, 2].forEach(index => {

                const btn =
                    document.createElement(
                        'button'
                    );

                btn.className =
                    'btn btn-large';

                const qKey =
                    `${selectedCategory}-${selectedDifficulty}-${index}`;

                if (
                    openedQuestions.has(qKey)
                ) {

                    btn.textContent =
                        `السؤال ${index + 1} (تمت الإجابة)`;

                    btn.disabled = true;

                } else {

                    btn.textContent =
                        `السؤال ${index + 1}`;

                    btn.onclick = () =>
                        selectQuestion(index);

                }

                qGrid.appendChild(btn);

            });

        }


        /* ================================
        QUESTION SELECTION
        ================================ */

        function selectQuestion(index) {

            selectedQuestionIndex = index;

            const qKey =
                `${selectedCategory}-${selectedDifficulty}-${index}`;

            openedQuestions.add(qKey);

            setupQuestionSlide();

            navigateTo(
                'question-screen'
            );

        }


        /* ================================
        QUESTION SETUP
        ================================ */

        function setupQuestionSlide() {

            const qData =
                gameData[selectedCategory]
                    [selectedDifficulty]
                    [selectedQuestionIndex];


            document
                .getElementById(
                    'q-breadcrumb'
                )
                .textContent =
                `${selectedCategory} | ${diffTextMap[selectedDifficulty]} (${pointsMap[selectedDifficulty]} نقطة)`;


            document
                .getElementById(
                    'question-text'
                )
                .textContent =
                qData.q;


            const choicesContainer =
                document.getElementById(
                    'choices-container'
                );

            choicesContainer.innerHTML = "";

            questionAnswered = false;


            qData.options.forEach(
                (opt, idx) => {

                    const btn =
                        document.createElement(
                            'button'
                        );

                    btn.className =
                        'btn btn-choice';

                    btn.textContent =
                        opt;

                    btn.onclick = () =>
                        handleAnswer(
                            idx,
                            btn
                        );

                    choicesContainer
                        .appendChild(btn);

                }
            );


            startTimer();

        }


        /* ================================
        TIMER
        ================================ */

        function startTimer() {

            clearInterval(
                timerInterval
            );

            timeLeft = 30;

            const timerBar =
                document.getElementById(
                    'timer-bar'
                );

            const timerNumber =
                document.getElementById(
                    'timer-number'
                );


            timerBar.style.width =
                '100%';

            timerNumber.textContent =
                `⏰ ${timeLeft}`;


            timerInterval =
                setInterval(() => {

                    timeLeft--;

                    timerNumber.textContent =
                        `⏰ ${timeLeft}`;

                    timerBar.style.width =
                        `${(timeLeft / 30) * 100}%`;


                    if (timeLeft <= 0) {

                        clearInterval(
                            timerInterval
                        );

                        handleTimeout();

                    }

                }, 1000);

        }


        /* ================================
        ANSWER
        ================================ */

        function handleAnswer(
            selectedIndex,
            buttonEl
        ) {

            if (questionAnswered)
                return;

            questionAnswered = true;

            clearInterval(
                timerInterval
            );


            const qData =
                gameData[selectedCategory]
                    [selectedDifficulty]
                    [selectedQuestionIndex];


            const choices =
                document.querySelectorAll(
                    '.btn-choice'
                );


            /* CORRECT */

            if (
                selectedIndex === qData.ans
            ) {

                buttonEl.classList.add(
                    'correct'
                );

                currentScore +=
                    pointsMap[
                        selectedDifficulty
                    ];

                updateScoreDisplays();

            }


            /* WRONG */

            else {

                buttonEl.classList.add(
                    'wrong'
                );

                choices[qData.ans]
                    .classList.add(
                        'correct'
                    );

            }


            disableAllChoices();

        }


        /* ================================
        TIMEOUT
        ================================ */

        function handleTimeout() {

            if (questionAnswered)
                return;

            questionAnswered = true;


            const qData =
                gameData[selectedCategory]
                    [selectedDifficulty]
                    [selectedQuestionIndex];


            const choices =
                document.querySelectorAll(
                    '.btn-choice'
                );


            choices[qData.ans]
                .classList.add(
                    'correct'
                );


            disableAllChoices();

        }

        REVEAL ANSWER
        ================================ */

        function revealAnswer() {

            if (questionAnswered)
                return;

            questionAnswered = true;

            clearInterval(
                timerInterval
            );


            const qData =
                gameData[selectedCategory]
                    [selectedDifficulty]
                    [selectedQuestionIndex];


            const choices =
                document.querySelectorAll(
                    '.btn-choice'
                );


            choices[qData.ans]
                .classList.add(
                    'correct'
                );


            disableAllChoices();

        }


        /* ================================
        DISABLE ANSWERS
        ================================ */

        function disableAllChoices() {

            document
                .querySelectorAll(
                    '.btn-choice'
                )
                .forEach(btn => {

                    btn.disabled = true;

                });

        }


        /* ================================
        RETURN TO QUESTIONS
        ================================ */

        function returnToQuestionSelect() {

            clearInterval(
                timerInterval
            );

            renderQuestionButtons();

            navigateTo(
                'question-select-screen'
            );

        }


        /* ================================
        RETURN TO CATEGORIES
        ================================ */

        function returnToCategories() {

            clearInterval(
                timerInterval
            );

            navigateTo(
                'categories-screen'
            );

        }

    </script>

</body>

</html>
